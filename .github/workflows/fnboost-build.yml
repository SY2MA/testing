name: FN Boost – build Windows

on:
  push:
    paths:
      - "FNBoost/**"
      - "FNBoost/tests/**"
      - ".github/workflows/fnboost-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test (statistiche FPS, sessioni, analisi, codici mirino)
        run: dotnet run --project FNBoost/tests/FNBoost.Tests/FNBoost.Tests.csproj -c Release

      - name: Publish (exe singolo, self-contained, x64)
        run: >
          dotnet publish FNBoost/src/FNBoost/FNBoost.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Carica FNBoost.exe
        uses: actions/upload-artifact@v4
        with:
          name: FNBoost-win-x64
          path: publish/FNBoost.exe
          if-no-files-found: error
